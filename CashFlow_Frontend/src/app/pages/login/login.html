<section class="login">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to continue tracking your income and expenses.</p>

    <div class="form">
      <label class="field">
        <span>Email</span>
        <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" [(ngModel)]="password" placeholder="Enter your password" />
      </label>

      <button class="btn" type="button" (click)="onLogin()">Login</button>

      <p class="error" *ngIf="error">{{ error }}</p>

      <p class="hint">
        Don’t have an account?
        <a routerLink="/register">Create one</a>
      </p>
    </div>
  </div>
</section>
