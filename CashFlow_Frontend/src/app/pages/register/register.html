<section class="register">
  <div class="card">
    <h1>Create account</h1>
    <p class="subtitle">Register to start tracking your transactions.</p>

    <div class="form">
      <label class="field">
        <span>Name</span>
        <input type="text" [(ngModel)]="name" placeholder="Enter your name" />
      </label>

      <label class="field">
        <span>Email</span>
        <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" [(ngModel)]="password" placeholder="Create a password" />
      </label>

      <button type="button" class="btn" (click)="onRegister()">Create account</button>

      <p class="error" *ngIf="error">{{ error }}</p>

      <p class="hint">
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>
    </div>
  </div>
</section>
