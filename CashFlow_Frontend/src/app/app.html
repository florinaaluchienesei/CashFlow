<nav class="navbar">
  <div class="navbar-inner">
    <div class="logo">CashFlow</div>

    <div class="nav-links" *ngIf="auth.isLoggedIn()">
      <a routerLink="/dashboard">Dashboard</a>
      <a routerLink="/transactions">Transactions</a>
      <a routerLink="/balance">Balance</a>
      <a routerLink="/savings">Savings</a>
    </div>

    <div class="auth">
      <a routerLink="/login" *ngIf="!auth.isLoggedIn()">Login</a>
      <a routerLink="/register" *ngIf="!auth.isLoggedIn()">Register</a>

      <span class="hello" *ngIf="auth.isLoggedIn()">Hello!</span>

      <button class="logout" *ngIf="auth.isLoggedIn()" (click)="logout()">
        Logout
      </button>
    </div>
  </div>
</nav>

<div class="page">
  <router-outlet></router-outlet>

  <app-chatbot *ngIf="auth.isLoggedIn()"></app-chatbot>
</div>
